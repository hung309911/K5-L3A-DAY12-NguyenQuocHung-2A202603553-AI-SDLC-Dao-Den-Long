name: Phase 1 verification
on: [push, pull_request]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-1-${{ matrix.os }}
          path: docs/proof/phase-1/
